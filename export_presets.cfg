[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
export_filter="all_resources"
include_filter="samples/sentinela_candidate_v10.sfs.json,examples/animation_candidate_v10/*,assets/public_library/*.json,assets/public_library/*.zip,services/catalog.py,GUIDE.txt,examples/export/doorway.gd.txt,examples/export/room_transition.gd.txt,examples/export/pixel_camera.gd.txt,examples/arton/*,examples/arton_projects/*,examples/animation_proof/*.sfs.json,examples/animation_proof/*.gif,examples/animation_candidate_v8/*,examples/animation_candidate_v9/*,samples/sentinela_v6.sfs.json,samples/sentinela_scale_study.sfs.json,samples/sentinela_artist_candidate_v8.sfs.json,samples/sentinela_artist_v9.sfs.json"
exclude_filter="test_results/*,tests/*,docs/*,vendor/*,examples/arton/assets/*,*.bak,*.tmp,*.md,*.ps1,*.cmd"
export_path="../Windows/SpriteForgeStudio.exe"
encryption_include_filters=""
encryption_exclude_filters=""
